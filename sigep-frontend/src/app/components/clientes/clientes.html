<div class="container-fluid px-4 pt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-0">Sistema de Gestión de Pedidos - SIGEP</h2>
      <p class="mb-0">Ud se ha identificado como: <strong>{{ nombre }}</strong></p>
    </div>
    <button class="btn btn-danger" (click)="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <div class="row">
    <div class="col-md-4">
      <div class="card p-3 mb-3">
        <h5>Mantenimiento de Clientes</h5>
        <div class="mb-2">
          <label>ID</label>
          <input class="form-control" [(ngModel)]="cliente.id_cliente"
                 placeholder="ID (Automático)" readonly>
        </div>
        <div class="row mb-2">
          <div class="col">
            <label>Nombre</label>
            <input class="form-control" [(ngModel)]="cliente.nombre" placeholder="Nombre">
          </div>
          <div class="col">
            <label>Apellido</label>
            <input class="form-control" [(ngModel)]="cliente.apellido" placeholder="Apellido">
          </div>
        </div>
        <div class="mb-2">
          <label>Email</label>
          <input class="form-control" [(ngModel)]="cliente.email" placeholder="correo@ejemplo.com">
        </div>
        <div class="mb-2">
          <label>Teléfono</label>
          <input class="form-control" [(ngModel)]="cliente.telefono" placeholder="987654321">
        </div>
        <div class="mb-3">
          <label>Dirección</label>
          <input class="form-control" [(ngModel)]="cliente.direccion" placeholder="Av. Ejemplo 123">
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" (click)="guardar()">Guardar</button>
          <button class="btn btn-secondary" (click)="volver()">Regresar</button>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <h5>Listado de Clientes</h5>
      <table class="table table-bordered table-sm">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Editar</th>
            <th>Eliminar</th>
          </tr>
        </thead>
        <tbody>
          @for (c of clientes; track c.id_cliente) {
            <tr>
              <td>{{ c.nombre }} {{ c.apellido }}</td>
              <td>{{ c.email }}</td>
              <td>{{ c.telefono }}</td>
              <td><button class="btn btn-warning btn-sm" (click)="editar(c)">Editar</button></td>
              <td><button class="btn btn-danger btn-sm" (click)="eliminar(c.id_cliente)">Eliminar</button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
