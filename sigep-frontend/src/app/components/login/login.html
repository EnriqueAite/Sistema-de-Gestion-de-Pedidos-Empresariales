<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">SIGEP - Login</h2>
          @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
          }
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-control" [(ngModel)]="credenciales.usuario" placeholder="Ingrese usuario">
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="credenciales.clave" placeholder="Ingrese contraseña">
          </div>
          <button class="btn btn-primary w-100" (click)="login()">Ingresar</button>
        </div>
      </div>
    </div>
  </div>
</div>
